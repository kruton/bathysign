name: Trusted Bathysign release builder
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      actions: read
    with:
      target: ${{ inputs.target }}
      runner: ${{ inputs.runner }}
      offline-bundle: true
  verify:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compared-${{ inputs.target }}-${{ github.run_attempt }}
          path: first
      - name: Generate SBOM
        run: |
          mkdir sbom-source
          git archive HEAD | tar -x -C sbom-source
          cp first/*.tar.gz sbom-source/
          docker run --rm --network none -v "$PWD/sbom-source:/src:ro" anchore/syft:v1.38.0@sha256:825cad3a952c87676a6d07e9a3bb05ac9c401d598360070e970aa46d54c1727e dir:/src -o spdx-json > first/sbom.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: sbom
        with:
          subject-path: first/*.tar.gz
          sbom-path: first/sbom.spdx.json
          create-storage-record: false
      - name: Preserve SBOM attestation bundle
        env:
          BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: cp "$BUNDLE" first/sbom-attestation.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: attest
        with:
          subject-path: |
            first/*.tar.gz
            first/*.json
            first/offline/*
      - name: Preserve verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" first/provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-${{ inputs.target }}-${{ github.run_attempt }}
          path: first/
