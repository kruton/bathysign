name: Bathysign prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ['TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?', tag)
          assert tag[1:] == tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          PY
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/lint-workflows.sh
  coverage:
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require passing SonarCloud coverage for the release commit
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/sonar-release-gate.py --published
  build:
    needs: [validate, coverage]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-hermit
            runner: ubuntu-24.04
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
  integration:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./bathysign/runtime
        with:
          tools: python java
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: verified-*-${{ github.run_attempt }}
          path: downloads
      - name: Authenticate integration inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release.py downloads --commit "$GITHUB_SHA" --ref "$GITHUB_REF"
      - name: Prepare integration environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 virtiofsd
          mkdir -p host guest
          tar -xf downloads/verified-x86_64-unknown-linux-gnu-*/bathysign-*.tar.gz -C host
          tar -xf downloads/verified-x86_64-unknown-hermit-*/bathysign-*.tar.gz -C guest
          docker build -t integration-builder -f deploy/build/Dockerfile .
      - name: Android reference verification (required)
        run: |
          java_home=$(mise -C bathysign/runtime where java)
          docker run --rm -v "$PWD:/src" -v "$java_home:$java_home:ro" -v "$ANDROID_HOME:$ANDROID_HOME:ro" -w /src integration-builder python3 scripts/test-android.py --java-home "$java_home" --android-sdk "$ANDROID_HOME"
      - name: Boot exact release appliance and exercise exact release collector
        run: python3 tests/qemu-smoke.py --tcg --loader "$PWD/guest/bin/hermit-loader" --image "$PWD/guest/bin/bathysign" --admin "$PWD/host/bin/bathysign-admin" --collector "$PWD/host/bin/bathysign-collector"
      - name: Action trust and publishing contracts
        run: |
          bash bathysign/scripts/install-trust.sh /tmp/release-trust
          /tmp/release-trust/bin/python -m unittest discover -s bathysign/tests
  containers:
    needs: [build, integration]
    uses: ./.github/workflows/release-container.yml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
  publish:
    needs: [build, integration, containers]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: verified-*-${{ github.run_attempt }}
          path: verified
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-evidence-${{ github.run_attempt }}
          path: container-evidence
      - name: Verify all downloads before creating a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/verify-release.py verified --commit "$GITHUB_SHA" --ref "refs/tags/$TAG"
          python3 scripts/publish-release.py verified "$TAG" "$GITHUB_SHA" container-evidence
