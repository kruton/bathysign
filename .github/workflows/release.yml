name: Bathysign prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ['TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?', tag)
          assert tag[1:] == tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          PY
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/lint-workflows.sh
  coverage:
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require passing SonarCloud coverage for the release commit
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/sonar-release-gate.py --published
  build:
    needs: [validate, coverage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-hermit
            runner: ubuntu-24.04
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
  integration:
    needs: build
    uses: ./.github/workflows/build-integration.yml
    permissions:
      contents: read
      actions: read
    with:
      release: true
  containers:
    needs: [build, integration]
    uses: ./.github/workflows/release-container.yml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
  publish:
    needs: [build, integration, containers]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: verified-*-${{ github.run_attempt }}
          path: verified
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-evidence-${{ github.run_attempt }}
          path: container-evidence
      - name: Verify all downloads before creating a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/verify-release.py verified --commit "$GITHUB_SHA" --ref "refs/tags/$TAG"
          python3 scripts/publish-release.py verified "$TAG" "$GITHUB_SHA" container-evidence
