name: Trusted collector container builder
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-${{ matrix.target }}-${{ github.run_attempt }}
          path: downloads
      - name: Authenticate binary and build twice
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          gh attestation verify downloads/*.tar.gz --bundle downloads/provenance.json --repo kruton/bathysign --signer-workflow kruton/bathysign/.github/workflows/release-build.yml --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          bash scripts/release-container.sh "$ARCH" downloads/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-${{ matrix.arch }}-${{ github.run_attempt }}
          path: container-output/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: container-*-${{ github.run_attempt }}
          path: containers
      - name: Publish verified OCI objects without rebuilding
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=$(python3 scripts/container-index.py containers index-first)
          second=$(python3 scripts/container-index.py containers index-second)
          test "$digest" = "$second"
          if existing=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/kruton/bathysign-collector:$TAG" 2>/dev/null); then
            test "$existing" = "$digest"
          else
            skopeo copy --all --preserve-digests oci:index-first:release "docker://ghcr.io/kruton/bathysign-collector:$TAG"
          fi
          remote=$(docker buildx imagetools inspect "ghcr.io/kruton/bathysign-collector:$TAG" --format '{{.Manifest.Digest}}')
          test "$digest" = "$remote"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: provenance
        with:
          subject-name: ghcr.io/kruton/bathysign-collector
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Preserve image provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" containers/image-provenance.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/kruton/bathysign-collector
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: containers/container-amd64-${{ github.run_attempt }}/sbom.spdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/kruton/bathysign-collector
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: containers/container-arm64-${{ github.run_attempt }}/sbom.spdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: evidence
        with:
          subject-path: containers/**/*
          create-storage-record: false
      - name: Preserve container evidence bundle
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
        run: cp "$BUNDLE" containers/evidence-provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-evidence-${{ github.run_attempt }}
          path: containers/
