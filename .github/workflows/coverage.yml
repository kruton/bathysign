name: Coverage inputs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./bathysign/runtime
        with:
          tools: python java
      - name: Prepare coverage tools
        run: |
          docker build -t coverage-builder -f deploy/build/Dockerfile .
          cargo install cargo-llvm-cov --version 0.9.1 --locked --root "$RUNNER_TEMP/coverage-tools"
          bash bathysign/scripts/install-trust.sh "$RUNNER_TEMP/trust"
          "$RUNNER_TEMP/trust/bin/python" -m pip install coverage==7.10.7
      - name: Collect Rust and Python coverage
        run: |
          mkdir -p coverage
          java_home=$(mise -C bathysign/runtime where java)
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/coverage-tools:/coverage-tools:ro" -v "$java_home:$java_home:ro" -v "$ANDROID_HOME:$ANDROID_HOME:ro" -w /src -e JAVA_HOME="$java_home" -e ANDROID_HOME="$ANDROID_HOME" coverage-builder bash -euo pipefail -c 'export PATH="$JAVA_HOME/bin:/coverage-tools/bin:$PATH"; exec bash scripts/collect-rust-coverage.sh "$JAVA_HOME" "$ANDROID_HOME"'
          export PATH="$RUNNER_TEMP/trust/bin:$PATH"
          "$RUNNER_TEMP/trust/bin/python" -m coverage run -m unittest discover -s tests -p 'test_*.py'
          "$RUNNER_TEMP/trust/bin/python" -m coverage run -m unittest discover -s bathysign/tests
          "$RUNNER_TEMP/trust/bin/python" -m coverage combine
          "$RUNNER_TEMP/trust/bin/python" -m coverage xml
          sed -i 's|SF:/src/|SF:|g' coverage/rust.lcov
      - name: Run Clippy without Sonar credentials
        run: docker run --rm -v "$PWD:/src" -w /src coverage-builder cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Stage reports for isolated analysis
        run: |
          mkdir -p coverage/sonar-inputs/reports
          cp coverage/rust.lcov coverage/python.xml coverage/sonar-inputs/reports/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-inputs-${{ github.run_attempt }}
          path: coverage/sonar-inputs/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
