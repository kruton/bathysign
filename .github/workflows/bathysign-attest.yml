name: Trusted Android artifact provenance
on:
  workflow_call:
    inputs:
      profile:
        description: Profile used in this run's immutable artifact names
        required: true
        type: string
permissions:
  contents: read
jobs:
  attest-unsigned:
    name: Attest unsigned ${{ inputs.profile }}
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: $/bathysign/runtime
      - name: Validate artifact profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          if not re.fullmatch(r"[a-z][a-z0-9-]{0,31}", os.environ["PROFILE"]):
              raise SystemExit("Invalid artifact profile")
          PYTHON
      - name: Download this attempt's immutable inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ inputs.profile }}-${{ github.run_attempt }}
          path: unsigned/
      - name: Download this attempt's release support files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-support-${{ inputs.profile }}-${{ github.run_attempt }}
          path: support/
      - name: Validate artifact handoff
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for directory, expected in (
              ("unsigned", {"app.apk", "app.aab"}),
              ("support", {"mapping.txt", "native-debug-symbols.zip", "build-info.json"}),
          ):
              entries = list(Path(directory).rglob("*"))
              files = {str(p.relative_to(directory)) for p in entries if p.is_file()}
              if any(p.is_symlink() for p in entries) or files != expected:
                  raise SystemExit("Unexpected artifact handoff: " + directory)
          PYTHON
      - name: Attest original APK, AAB, and release support files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            unsigned/app.apk
            unsigned/app.aab
            support/mapping.txt
            support/native-debug-symbols.zip
            support/build-info.json
          create-storage-record: false
      - name: Preserve provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          FLAVOR: ${{ inputs.profile }}
        run: cp "$BUNDLE" "provenance-${FLAVOR}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ inputs.profile }}-${{ github.run_attempt }}
          path: provenance-${{ inputs.profile }}.json
          if-no-files-found: error
