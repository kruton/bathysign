# Install as .github/workflows/android-build-reusable.yml.
# Pin/review workflow contents in signer policy after adapting JDK/SDK/tasks.
name: Trusted reusable Android builder
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Provision a pinned JDK/Android SDK here. No shared release caches.
      - run: ./gradlew --no-build-cache --no-configuration-cache :app:assembleRelease :app:bundleRelease
      - name: Prepare immutable signing inputs
        run: |
          mkdir unsigned support
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned/app.apk
          cp app/build/outputs/bundle/release/app-release.aab unsigned/app.aab
          # Adapt these three application-owned paths to the actual Gradle outputs.
          cp app/build/outputs/mapping/release/mapping.txt support/mapping.txt
          cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip support/native-debug-symbols.zip
      - name: Prepare attested release metadata
        uses: kruton/bathysign/bathysign@bathysign-v1 # Pin the reviewed full commit in production.
        with:
          command: build-info
          profile: default
          version-code-file: app/build/outputs/version-code.txt
          version-name-file: app/build/outputs/version-name.txt
          out: support
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-default-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-support-default-${{ github.run_attempt }}
          path: support/
          if-no-files-found: error
  attest:
    needs: build
    uses: kruton/bathysign/.github/workflows/bathysign-attest.yml@bathysign-v1
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      profile: default
