name: Set up the Android signer runtime
description: Install the signer's locked Python and optional Java runtime.
inputs:
  tools:
    description: Tools from the signer lockfile to install.
    default: python
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      env:
        MISE_TRUSTED_CONFIG_PATHS: ${{ github.action_path }}
      with:
        version: 2026.10.25
        working_directory: ${{ github.action_path }}
        install_args: --locked ${{ inputs.tools }}
        cache: false
        add_shims_to_path: false
